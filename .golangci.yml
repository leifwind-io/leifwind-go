version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - goheader
    - gosec
    - govet
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    goheader:
      template: "SPDX-License-Identifier: MPL-2.0"
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
